<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Desk | Knowledge Base</title>
    <link rel="stylesheet" href="css/knowledge-base.css">
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="brand"><div class="logo">SD</div><div><strong>Service Desk</strong><span>Management Portal</span></div></div>
        <nav>
            <div class="nav-label">MAIN</div>
            <a href="dashboard.html" class="nav-item"><span>▦</span>Dashboard</a>
            <div class="nav-label">SERVICE MANAGEMENT</div>
            <a href="incidents.html" class="nav-item"><span>⚠</span>Incidents</a>
            <a href="service-requests.html" class="nav-item"><span>▣</span>Service Requests</a>
            <a href="problems.html" class="nav-item"><span>◉</span>Problems</a>
            <a href="changes.html" class="nav-item"><span>⇄</span>Changes</a>
            <div class="nav-label">RESOURCES</div>
            <a href="knowledge-base.html" class="nav-item active"><span>▤</span>Knowledge Base</a>
            <a href="users.html" class="nav-item"><span>◌</span>Users</a>
            <a href="reports.html" class="nav-item"><span>▥</span>Reports</a>
        </nav>
        <div class="sidebar-bottom">
            <a href="settings.html" class="nav-item"><span>⚙</span>Settings</a>
            <button id="logoutBtn"><span>↪</span>Logout</button>
        </div>
    </aside>
    <main class="main">
        <header class="header">
            <div class="header-left">
                <button class="mobile-menu" id="mobileMenu">☰</button>
                <div><h1>Knowledge Base</h1><p>Search solutions and find answers</p></div>
            </div>
            <div class="header-right">
                <button class="notification">🔔<i></i></button>
                <div class="profile"><div class="avatar">A</div><div><strong id="profileName">Admin</strong><span>Administrator</span></div></div>
            </div>
        </header>
        <div class="content">
            <div class="search-hero">
                <div class="search-box">
                    <span class="search-icon">⌕</span>
                    <input type="text" id="kbSearch" placeholder="Search knowledge base articles...">
                </div>
            </div>

            <div class="categories-section">
                <h3>Categories</h3>
                <div class="categories-grid" id="categoriesGrid"></div>
            </div>

            <div class="articles-section">
                <div class="section-row">
                    <h3 id="articlesTitle">All Articles</h3>
                    <span id="articleCount" class="count-badge">0 articles</span>
                </div>
                <div class="articles-list" id="articlesList"></div>
            </div>
        </div>
    </main>
</div>

<!-- ARTICLE MODAL -->
<div class="modal-overlay" id="articleModal">
    <div class="modal article-modal">
        <div class="modal-header">
            <h3 id="articleTitle">Article</h3>
            <button class="modal-close" id="articleClose">✕</button>
        </div>
        <div class="modal-body article-body">
            <div class="article-meta" id="articleMeta"></div>
            <div class="article-content" id="articleContent"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>
<script src="js/knowledge-base.js"></script>
</body>
</html>
